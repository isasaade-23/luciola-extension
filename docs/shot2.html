<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Luciola popup</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; align-items: center; justify-content: center;
         background: #E8E2DA; font-family: system-ui, sans-serif; color: #2B2B2B; }
  .popup { width: 300px; background: #F6F2EE; border-radius: 12px;
           box-shadow: 0 18px 50px rgba(31,48,80,.28), 0 2px 8px rgba(31,48,80,.18); overflow: hidden; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  header img { width: 22px; height: 22px; }
  header b { font-size: 16px; letter-spacing: .5px; color: #1F3050; }
  header small { margin-left: auto; font-size: 10px; font-weight: 700;
                 color: #fff; background: #EE6C4D; border-radius: 999px; padding: 2px 7px; }
  main { padding: 4px 14px 12px; }
  button#scan { width: 100%; padding: 10px 0; border: 0; border-radius: 999px;
                background: #1F3050; color: #fff; font-weight: 800; font-size: 13px;
                letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; font-size: 12px; }
  .row input { flex: 1; accent-color: #EE6C4D; }
  #thval { font-variant-numeric: tabular-nums; font-weight: 800; color: #1F3050; }
  #stats { font-size: 12.5px; margin: 10px 0 0; min-height: 18px; color: #1F3050; }
  #stats b { color: #B93A20; }
  .note { font-size: 11px; color: #5D6673; line-height: 1.5; margin: 10px 0 0; }
  .note a { color: #3D5A80; font-weight: 700; }
</style>
</head>
<body>
<div class="popup">
<header>
  <img src="icon48.png" alt="">
  <b>Luciola</b>
  <small>BETA 2.0</small>
</header>
<main>
  <button id="scan">Analisar esta página</button>
  <div class="row">
    <span id="thlabel">Limiar</span>
    <input id="th" type="range" min="0.05" max="0.80" step="0.01" value="0.42">
    <span id="thval">42%</span>
  </div>
  <div id="stats">Blocos analisados: 12 · <b>sinalizados: 3</b></div>
  <p class="note">As probabilidades são uma representação do modelo, não um
  veredito humano. O estudo por trás da ferramenta mede sobre-sinalização de
  alguns termos de identidade. Ela apoia a revisão, não a substitui.
  <a href="#">Saiba mais</a></p>
</main>
</div>
</body>
</html>
