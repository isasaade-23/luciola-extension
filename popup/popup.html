<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; font-family: system-ui, sans-serif;
         background: #F6F2EE; color: #2B2B2B; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  header img { width: 22px; height: 22px; }
  header b { font-size: 16px; letter-spacing: .5px; color: #1F3050; }
  header small { margin-left: auto; font-size: 10px; font-weight: 700;
                 color: #fff; background: #EE6C4D; border-radius: 999px; padding: 2px 7px; }
  main { padding: 4px 14px 12px; }
  button#scan { width: 100%; padding: 10px 0; border: 0; border-radius: 999px;
                background: #1F3050; color: #fff; font-weight: 800; font-size: 13px;
                letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  button#scan:hover { background: #EE6C4D; }
  .row { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; font-size: 12px; }
  .row input { flex: 1; accent-color: #EE6C4D; }
  #thval { font-variant-numeric: tabular-nums; font-weight: 800; color: #1F3050; }
  #stats { font-size: 12.5px; margin: 10px 0 0; min-height: 18px; color: #1F3050; }
  #stats b { color: #B93A20; }
  .note { font-size: 11px; color: #5D6673; line-height: 1.5; margin: 10px 0 0; }
  .note a { color: #3D5A80; font-weight: 700; }
  #yt { border-top: 1px solid #E2D9D0; margin: 12px 0 0; padding: 10px 0 0; }
  #yt h2 { font-size: 12px; margin: 0 0 6px; color: #1F3050; letter-spacing: .3px; }
  #yt label { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 4px 0; cursor: pointer; }
  #yt input { accent-color: #EE6C4D; margin: 0; }
  #yt .levels { display: flex; gap: 10px; flex-wrap: wrap; }
  #yt fieldset { border: 0; padding: 0; margin: 6px 0 0; }
  #yt legend { font-size: 11px; color: #5D6673; padding: 0; margin: 0 0 2px; }
</style>
</head>
<body>
<header>
  <img src="../icons/icon48.png" alt="">
  <b>Luciola</b>
  <small>BETA 1.1</small>
</header>
<main>
  <button id="scan"></button>
  <div class="row">
    <span id="thlabel"></span>
    <input id="th" type="range" min="0.05" max="0.80" step="0.01">
    <span id="thval"></span>
  </div>
  <div id="stats"></div>
  <p class="note" id="note"></p>
  <section id="yt">
    <h2 id="yt_section"></h2>
    <label><input id="ytEnabled" type="checkbox"> <span id="yt_enabled"></span></label>
    <fieldset id="ytLevels">
      <legend id="yt_level"></legend>
      <div class="levels">
        <label><input type="radio" name="ytLevel" value="conservative"> <span id="yt_level_conservative"></span></label>
        <label><input type="radio" name="ytLevel" value="balanced"> <span id="yt_level_balanced"></span></label>
        <label><input type="radio" name="ytLevel" value="sensitive"> <span id="yt_level_sensitive"></span></label>
      </div>
    </fieldset>
    <p class="note" id="yt_level_hint"></p>
    <p class="note" id="yt_limits"></p>
  </section>
</main>
<script src="popup.js"></script>
</body>
</html>
